# IDP Configuration
idp.idpName=keycloak
idp.clientId=blog-auth-private
idp.clientSecret=k94Hna2SQdRmEhgQqedOBh0LqvMxpFH7
idp.serverUri=http://localhost:9003
idp.realm=fusion-master
idp.authorizationGrantType=authorization_code

# Server
server.port=9001
server.servlet.context-path=/

# SpringDoc (Swagger)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.oauth.realm=fusion-master
springdoc.swagger-ui.oauth.client-id=blog-auth-private
springdoc.swagger-ui.oauth.client-secret=k94Hna2SQdRmEhgQqedOBh0LqvMxpFH7

# Spring DevTools
spring.devtools.restart.enabled=true

# Application Name
spring.application.name=blog-service

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Spring Security OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9003/realms/fusion-master

# OAuth2 Client Configuration
spring.security.oauth2.client.registration.keycloak.client-id=blog-auth-private
spring.security.oauth2.client.registration.keycloak.client-secret=k94Hna2SQdRmEhgQqedOBh0LqvMxpFH7
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri=http://localhost:9003/login/oauth2/code/keycloak
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:9003/realms/fusion-master
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# Docker Compose (Spring Boot 3.1+)
spring.docker.compose.lifecycle-management=START_AND_STOP

# Logging Levels
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=INFO
logging.pattern.level=%5p [X-Request-Id:%X{X-Request-Id}]
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %5p [X-Request-Id:%X{X-Request-Id}] %c{1}:%L - %m%n

# Cloud Stream Configuration
spring.cloud.stream.default-binder=rabbit
# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=15672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

# Consumer Bindings
spring.cloud.stream.bindings.logEvent-out-0.destination=blog.logs
spring.cloud.stream.bindings.keycloakEvent-out-0.destination=blog.keycloak.events

# Producer Bindings
spring.cloud.stream.bindings.logEvent-in-0.destination=blog.logs
spring.cloud.stream.bindings.logEvent-in-0.group=logger-group

spring.cloud.stream.bindings.keycloakEvent-in-0.destination=blog.keycloak.events
spring.cloud.stream.bindings.keycloakEvent-in-0.group=keycloak-group

spring.cloud.stream.rabbit.bindings.logEvent-in-0.consumer.autoBindDlq=true
spring.cloud.stream.rabbit.bindings.logEvent-in-0.consumer.ackMode=MANUAL
spring.cloud.stream.rabbit.bindings.logEvent-in-0.consumer.prefetch=5

spring.cloud.stream.rabbit.bindings.keycloakEvent-in-0.consumer.autoBindDlq=true
spring.cloud.stream.rabbit.bindings.keycloakEvent-in-0.consumer.ackMode=MANUAL
spring.cloud.stream.rabbit.bindings.keycloakEvent-in-0.consumer.prefetch=10



spring.cloud.stream.binders.rabbitmq.properties.host=localhost
spring.cloud.stream.binders.rabbitmq.properties.port=15672